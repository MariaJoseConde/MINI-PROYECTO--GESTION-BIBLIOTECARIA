<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#183B4E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script>
      try {
        const saved = localStorage.getItem("theme");
        if (saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="color-scheme"]').content = "dark";
        } else {
          document.documentElement.classList.remove("dark");
          document.querySelector('meta[name="color-scheme"]').content = "light";
        }
      } catch (e) {}
    </script>
    <title>biblioSmart · Plataforma Educativa y Estudio con IA</title>
    <meta name="description" content="biblioSmart: Plataforma educativa y de gestión bibliotecaria con herramientas de estudio impulsadas por IA, evaluaciones pedagógicas y catálogo accesible." />
    <meta property="og:title" content="biblioSmart · Plataforma Educativa y Estudio con IA" />
    <meta property="og:description" content="biblioSmart: Plataforma educativa y de gestión bibliotecaria con herramientas de estudio impulsadas por IA, evaluaciones pedagógicas y catálogo accesible." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 text-slate-800 font-sans selection:bg-indigo-100 selection:text-indigo-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
